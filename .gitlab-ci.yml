image: node:22-bookworm

pages:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nasm gcc-multilib binutils make seabios vgabios > /dev/null
    - make
    - mkdir -p public/v86 /tmp/v86
    - cp web/index.html public/index.html
    - cp build/textile.img public/textile.img
    - (cd /tmp/v86 && npm install --no-audit --no-fund v86@0.5.472 > /dev/null)
    - cp /tmp/v86/node_modules/v86/build/libv86.js /tmp/v86/node_modules/v86/build/v86.wasm public/v86/
    - cp /usr/share/seabios/bios-256k.bin public/v86/seabios.bin
    - cp /usr/share/seabios/vgabios-stdvga.bin public/v86/vgabios.bin
  artifacts:
    paths:
      - public
