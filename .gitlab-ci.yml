image: node:22-bookworm

# Speeds up subsequent runs by storing the npm cache across pipeline steps
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .npm/

pages:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nasm gcc-multilib binutils make seabios vgabios xorriso python3 > /dev/null
    - make ARCH=i386
    - mkdir -p public/v86 /tmp/v86
    - cp web/index.html public/index.html
    - cp build/textile.img public/textile.img
    - xorriso -as mkisofs -quiet -b textile.img -o public/textile.iso public/textile.img

    # Leverages local caching and turns off unnecessary logs completely
    - (cd /tmp/v86 && npm install --no-audit --no-fund --cache $CI_PROJECT_DIR/.npm v86@0.5.472 > /dev/null)

    - cp /tmp/v86/node_modules/v86/build/libv86.js /tmp/v86/node_modules/v86/build/v86.wasm public/v86/
    - cp /usr/share/seabios/bios-256k.bin public/v86/seabios.bin
    - cp /usr/share/seabios/vgabios-stdvga.bin public/v86/vgabios.bin
  artifacts:
    paths:
      - public

# Builds the explorer app as an .airp file. Allowed to fail so a bad app never blocks Pages.
airp-explorer:
  stage: test
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gcc-multilib binutils python3 > /dev/null
    - mkdir -p build/airp
    - CFLAGS="-m32 -std=gnu99 -ffreestanding -fno-pic -fno-stack-protector -fno-builtin -fno-common -fno-tree-loop-distribute-patterns -fcf-protection=none -fno-asynchronous-unwind-tables -O2 -Wall -Wextra"
    - gcc $CFLAGS -c userland/explorer.c -o build/airp/explorer.o
    - gcc $CFLAGS -c userland/rt.c -o build/airp/rt.o
    - ld -m elf_i386 -nostdlib -T userland/app.ld -o build/airp/explorer.elf build/airp/explorer.o build/airp/rt.o
    - objcopy -O binary build/airp/explorer.elf build/airp/explorer.bin
    - python3 tools/airpack.py build/airp/explorer.bin build/airp/explorer.airp explorer
  artifacts:
    paths:
      - build/airp/explorer.airp

# Confirms the build accepts i386 and refuses x86-64 and ARM until their boot layers exist.
arch-guard:
  stage: test
  script:
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq make > /dev/null
    - make -n ARCH=i386 > /dev/null
    - if make -n ARCH=x86_64 > /dev/null 2>&1; then echo "x86_64 must be refused until it has a boot layer"; exit 1; fi
    - if make -n ARCH=arm > /dev/null 2>&1; then echo "arm must be refused until it has a boot layer"; exit 1; fi

# Really compiles the i386 disk image and runs the host filesystem checks. Fails if the image is missing or empty, or if any fs-test check fails, so kernel and filesystem errors cannot pass on a feature branch.
build-branch:
  stage: test
  script:
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nasm gcc-multilib binutils make > /dev/null
    - make ARCH=i386
    - test -s build/textile.img
    - make fs-test
